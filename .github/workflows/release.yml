name: Release

# Publishes DiluxOne Multisite User Sync (slug wpm-user-sync) to wordpress.org
# as a deployment the maintainer approves, through the shared workflow in
# DiluxOne/.github: every push to main publishes the development build (the
# shipped tree stamped <next>-dev.<N>) as the one "Development build"
# pre-release on the moving tag `dev`, and computes the next version from the
# type:* labels of what merged. While the newest changelog entry of readme.txt
# starts with the line `Unreleased.` the version is not ready and nothing
# waits; once a pull request removed that line (and set the version markers to
# the version it releases), the job waits for approval in the environment
# `wordpress-org`, then checks that the markers say that version, deploys,
# tags and creates the release. Release tags are permanent: a failed deploy is
# fixed and re-run, never re-tagged. See docs/release.md.
#
# The SVN credentials and the release App's key live in the environment
# `wordpress-org`. An environment's secrets reach a called workflow only
# through `secrets: inherit`, which passes every repository and organisation
# secret too; that is why this workflow runs only on main and on X.Y.Z tags
# and calls the shared workflow at `v5`, a protected ref of DiluxOne/.github
# that only an administrator moves: that is what bounds the code that runs
# with these secrets (nothing is pinned to a commit, DiluxOne/.github#136).
#
# It publishes (dry-run: false). To rehearse instead (everything but the SVN
# commit, the tag and the release), a pull request of its own sets it to true.

on:
  push:
    # security/X.Y.Z: a security patch on the version in production, pushed
    # by dilux-security once a maintainer approved it in the private
    # repository (DiluxOne/.github#247, #287).
    branches: [main, 'security/[0-9]+.[0-9]+.[0-9]+']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # The release, published: where the plugin goes next (#287).
  release:
    types: [published]
  # Publish a release again by hand (after a failure), by its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish to wordpress.org again (X.Y.Z).
        required: true

permissions:
  contents: write
  pull-requests: read # the labels of what merged decide the version
  issues: read # the release issue a person accepted, the approval
  actions: read # the environment's protection rules, and the runs still waiting

jobs:
  release:
    if: github.event_name == 'push'
    # At `v6`, never a pinned commit: see the header.
    uses: DiluxOne/.github/.github/workflows/plugin-release-wp.yml@v6
    with:
      slug: wpm-user-sync
      version-constant: WPMUS_VERSION
      dry-run: false
      main-file: wpm-user-sync.php
    secrets: inherit

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: DiluxOne/.github/.github/workflows/plugin-publish-wp.yml@v6
    with:
      slug: wpm-user-sync
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
