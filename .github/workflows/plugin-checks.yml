name: Plugin checks

# The checks of DiluxOne Multisite User Sync (wordpress.org slug
# wpm-user-sync), from the shared workflows in DiluxOne/.github: the fast
# quality gates and the slow wp-env suites, on every pull request, on a push
# to main, once a week and by hand. A push to main runs the suites only when
# its tree is not the one the pull request's checks ran on; a scheduled
# failure opens one ci:weekly issue. The conventions, the accepted-issue
# gate, the Claude review and the auto-merge decision are the organisation's
# (org-pull-request.yml, required by its ruleset): nothing of them here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue's group (#451): the checks it requires run on it too, and
  # where the repository has a queue the slow suites run here, not on the
  # pull request.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # Once a week, and by hand, everything runs whatever changed: the suites
  # against today's WordPress and tools. A failure opens (or updates) one issue.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: read # the push to main looks up the pull request it came from
      checks: read # and the checks of its head
    uses: DiluxOne/.github/.github/workflows/plugin-checks-wp.yml@v7
    with:
      slug: wpm-user-sync
      main-file: wpm-user-sync.php
      version-constant: WPMUS_VERSION

  tests:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v7
    with:
      # Both wp-env sites are networks already (.wp-env.json, "multisite":
      # true); converting the tests site again would fail.
      multisite: false

  weekly-failure:
    needs: [checks, tests]
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/weekly-failure.yml@v7
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
