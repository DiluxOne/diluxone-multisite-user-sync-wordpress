name: SVN credentials check

# Run by hand after rotating the wordpress.org SVN password: proves the
# secrets in the `wordpress-org` environment authenticate, without
# publishing anything (the shared workflow in DiluxOne/.github, called at
# `v5` like the release: it runs with the same credentials).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: DiluxOne/.github/.github/workflows/svn-auth-check.yml@v6
    # An environment's secrets reach a called job only through `inherit`,
    # which also passes every repository and organisation secret; hence the
    # by-hand trigger, and the call at `v5`, a protected ref only an administrator moves.
    secrets: inherit
