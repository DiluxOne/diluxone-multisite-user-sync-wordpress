name: Integration tests (multisite)

# Boots a real multisite WordPress via wp-env and runs the integration
# PHPUnit suite against it. Distinct from the unit suite in pr-checks.yml,
# which runs in pure PHP without a WordPress runtime.
#
# Slower than the unit job (wp-env boot is ~1 minute, then tests, then
# teardown). Runs only on PRs targeting main and on pushes to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    name: PHPUnit (integration suite, multisite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-int-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-int-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-int-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-int-${{ runner.os }}-

      - name: Install @wordpress/env
        run: npm install --no-audit --no-fund

      - name: Start wp-env (multisite)
        # `.wp-env.json` declares `"multisite": true`, so the stack
        # comes up as a subdirectory multisite at localhost:8888.
        run: npx wp-env start

      - name: Run integration test suite
        # `tests-cli` is the WP-CLI container against the *test* WordPress
        # site (port 8889 in the dev environment, but the container itself
        # has WordPress at /var/www/html/, which is what the bootstrap loads).
        run: |
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/wpm-user-sync \
            ./vendor/bin/phpunit -c phpunit-integration.xml.dist --colors=never

      - name: Show wp-env logs on failure
        if: failure()
        run: npx wp-env logs all

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop || true
