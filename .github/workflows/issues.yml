name: Issues

# What happens to an issue, from the shared workflows in DiluxOne/.github: the
# triage classifies it when it opens (from docs/roadmap.md and the docs) and
# the reproduction job tries to write a failing unit test for a report the
# triage calls a bug (repro-triaged), and a maintainer can start one by hand
# with the label repro:run. Fill in support-url.

on:
  issues:
    types: [opened, labeled, closed]
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/issue-triage.yml@v5
    with:
      support-url: https://wordpress.org/support/plugin/wpm-user-sync/
    secrets: inherit

  repro:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v5
    secrets: inherit

  repro-triaged:
    needs: triage
    if: needs.triage.outputs.bug == 'true'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v5
    with:
      trigger: triage
      triage-bug: ${{ needs.triage.outputs.bug }}
    secrets: inherit

  # When a person accepts an issue: it lands on its product's Project as
  # Accepted, and a pull request opened before gets its gate re-run. When it
  # closes: Done.
  accepted:
    permissions:
      actions: write
      issues: read
      pull-requests: read
    uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v5
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
