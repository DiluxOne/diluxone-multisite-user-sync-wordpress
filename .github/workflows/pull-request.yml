name: Pull request

# Every check a change to DiluxOne Multisite User Sync (wordpress.org slug
# wpm-user-sync) goes through, from the shared workflows in DiluxOne/.github:
# conventions, the fast quality gates, then the Claude review and the
# auto-merge decision, with the slow wp-env suites running alongside the
# review.
#
# Nothing runs twice for one change: an edit of the title or description is
# handled by pull-request-edited.yml (no suites), and a push to main runs the
# suites only when its tree is not the one the pull request's checks ran on.
# Once a week, and on the Run workflow button, everything runs against
# today's WordPress and tools; a scheduled failure opens one ci:weekly issue.
#
# These callers only run once the repository lives in the DiluxOne
# organisation (the reusable workflows, the organisation secrets and the
# dilux-bot App are there): docs/release.md, "Moving into DiluxOne".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check on `edited`
    uses: DiluxOne/.github/.github/workflows/conventions.yml@v3
    with:
      # The old display name, WPM User Sync, still appears on purpose (the
      # readme's history, "formerly"), so nothing is retired yet.
      retired-names: ''

  checks:
    permissions:
      contents: read
      pull-requests: read # the push to main looks up the pull request it came from
      checks: read # and the checks of its head
    uses: DiluxOne/.github/.github/workflows/plugin-checks-wp.yml@v3
    with:
      slug: wpm-user-sync
      main-file: wpm-user-sync.php
      version-constant: WPMUS_VERSION
      # From Requires PHP (8.0) to the latest.
      php-versions: '["8.0","8.1","8.2","8.3","8.4","8.5"]'

  tests:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v3
    with:
      # Both wp-env sites are networks already (.wp-env.json, "multisite":
      # true); converting the tests site again would fail.
      multisite: false

  review:
    needs: [conventions, checks]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: DiluxOne/.github/.github/workflows/claude-review.yml@v3
    with:
      profile: plugin-wp
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  auto-merge:
    needs: review
    if: always() && needs.review.result != 'skipped'
    uses: DiluxOne/.github/.github/workflows/auto-merge.yml@v3
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      enabled: ${{ needs.review.outputs.auto-merge }}
      description-ok: ${{ needs.review.outputs.description-ok }}
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  weekly-failure:
    needs: [checks, tests]
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/weekly-failure.yml@v3
