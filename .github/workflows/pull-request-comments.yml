name: Pull request comments

# A person who mentions @dilux-bot in a pull request, in a review thread or in
# the conversation, gets an answer from the Claude reviewer, through the shared
# workflow in DiluxOne/.github.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  reply:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: DiluxOne/.github/.github/workflows/review-reply.yml@v2
    with:
      profile: plugin-wp
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
