name: ✨ Feature request
description: Suggest new functionality or an enhancement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new feature. Before submitting, search this repository's existing issues and its roadmap (docs/roadmap.md) to make sure it is not already there. For usage questions ("how do I…?"), use the [wordpress.org support forum](https://wordpress.org/support/plugin/wpm-user-sync/).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The use case behind the request. Focus on the *why*, not the *how*.
      placeholder: As a [network admin], I want to [goal] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like the plugin to behave? Which trigger, action, setting or filter?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and any workaround you use today.

  - type: dropdown
    id: scope
    attributes:
      label: Which area of the plugin does this affect?
      multiple: true
      options:
        - New user trigger
        - New site trigger
        - Role change trigger
        - Manual sync actions
        - Background syncs (WP-Cron)
        - Permissions / who sees what
        - Filters for developers
        - Admin screens
        - Translations
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to similar features elsewhere.
